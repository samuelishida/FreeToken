tinygrad-runner-jit:
  file: tinygrad-runner-jit.md
  description: The tinygrad runner's JIT pattern (bind UOp variables outside the JIT'd function, two JITs, warmup twice, public logits() in the fork, max_context % 128). Read before touching engine/tinygrad_runner.py or the fork's model API.
freetoken-device-seam:
  file: freetoken-device-seam.md
  description: The non-CUDA device seam (batch.input_ids is the extend, pin_memory guards, max_seq_len from the runner, sync_all_ranks no-op). Read before adding another non-CUDA device or touching scheduler batch plumbing.
amd-stack-concepts:
  file: amd-stack-concepts.md
  description: Guia de estudo — kfd, ioctls, HIP, GLSL, compilação runtime do tinygrad, RDNA3-only, detecção de hardware/fallback, OpenCL vs kfd, portabilidade Windows.
tinygrad-rangeify:
  file: tinygrad-rangeify.md
  description: O rangeify (o gerador do grafo de kernel do fork) tolera extensões simbólicas — a mecânica do broadcast OOB (pós-EXPAND ranges × full-rank indexing) e o REDUCE com os ranges sintetizados. Read antes de tocar schedule/indexing.py ou os kernels com extents simbólicos.
tinygrad-moe-capture-nan:
  file: tinygrad-moe-capture-nan.md
  description: O fused expert-decode GEMM corrompe grafos TinyJit >=16K (NaN logits, crash do server); MoE genérico é o comprovado. Bench greedy não pega NaN - validar conteúdo com scripts/probe-decode-nan.py.
qwen38-engram-ssd:
  file: qwen38-engram-ssd.md
  description: Qwen4-Exp GGUF work: preserve raw QSA/PLE state, split multi-block quant rows, use standard ROCm Engine with Q8 QSA KV, bounded lock-free PLE I/O, and distinguish warm throughput from cold HIP compilation.
qwen38-ssd-residency-implementation:
  file: qwen38-ssd-residency-implementation.md
  description: Qwen3.8 SSD PLE implementation decisions: bounded sidecar paging, expert residency preflight, grouped ROCm MoE, scheduler fairness, and restart requirements for live validation.
qwen38-grouped-moe-oom:
  file: qwen38-grouped-moe-oom.md
  description: Avoid Qwen3.8 grouped MoE route-weight replication: shared per-group GEMMs keep prefill workspace bounded on 24 GiB ROCm cards.
